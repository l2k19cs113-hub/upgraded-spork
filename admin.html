<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | AI Predict</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-header {
            margin-bottom: 30px;
        }

        .user-list {
            margin: 25px 0;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(2, 6, 23, 0.4);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .delete-btn {
            color: var(--result-red);
            cursor: pointer;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            line-height: 1;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: rgba(244, 63, 94, 0.1);
            transform: scale(1.1);
        }

        .nav-btn {
            margin-top: 20px;
            background: transparent !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-secondary) !important;
            box-shadow: none !important;
            padding: 15px !important;
            font-size: 0.9rem !important;
        }

        .nav-btn:hover {
            border-color: var(--text-secondary) !important;
            color: var(--text-primary) !important;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="glass-container">
        <header class="admin-header">
            <img src="logo.jpg" alt="AI Predict Logo" class="app-logo">
            <h1>Admin <span>Panel</span></h1>
            <p class="subtitle">Control Center</p>
        </header>

        <main>
            <div class="input-group">
                <label>NEW USER PHONE</label>
                <div class="input-wrapper">
                    <input type="tel" id="newPhone" placeholder="Enter Phone Number" autocomplete="off">
                </div>
            </div>
            <div class="input-group">
                <label>NEW USER PASSWORD</label>
                <div class="input-wrapper">
                    <input type="text" id="newPass" placeholder="Enter Password" autocomplete="off">
                </div>
            </div>
            <div class="input-group">
                <label>REGISTRATION DATE</label>
                <div class="input-wrapper">
                    <input type="date" id="regDate">
                </div>
            </div>

            <button id="createUserBtn" class="action-btn">
                <span class="btn-text">CREATE USER</span>
            </button>

            <div class="user-list" id="userList">
                <!-- Users will be listed here -->
            </div>

            <button onclick="window.location.href='index.html'" class="action-btn nav-btn">
                LOGOUT
            </button>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script>
        const phoneInput = document.getElementById('newPhone');
        const passInput = document.getElementById('newPass');
        const createBtn = document.getElementById('createUserBtn');
        const userList = document.getElementById('userList');

        async function loadUsers() {
            if (!window.sbHelpers) {
                userList.innerHTML = '<p style="text-align:center; color:#ef4444;">Connecting to DB...</p>';
                // Retry once if helpers not ready
                setTimeout(loadUsers, 500);
                return;
            }

            const users = await window.sbHelpers.getAllUsers();
            userList.innerHTML = '';

            if (users.length === 0) {
                userList.innerHTML = '<p style="text-align:center; color:#94a3b8;">No users created yet.</p>';
                return;
            }

            users.forEach((u) => {
                const div = document.createElement('div');
                div.className = 'user-item';
                // Format date for display
                const dateStr = u.reg_date ? new Date(u.reg_date).toLocaleDateString() : 'No Date';
                div.innerHTML = `
                    <div style="display: flex; flex-direction: column;">
                        <span style="color: var(--text-primary); font-weight: 600;">${u.phone} / ${u.pass}</span>
                        <span style="font-size: 0.75rem; color: var(--accent-primary);">Reg: ${dateStr}</span>
                    </div>
                    <span class="delete-btn" onclick="deleteUser('${u.id}')">×</span>
                `;
                userList.appendChild(div);
            });
        }

        createBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            const pass = passInput.value.trim();
            const regDate = document.getElementById('regDate').value;

            if (!phone || !pass || !regDate) {
                alert('Please fill all fields including Registration Date');
                return;
            }

            try {
                await window.sbHelpers.registerUser(phone, pass, regDate);
                phoneInput.value = '';
                passInput.value = '';
                document.getElementById('regDate').value = '';
                loadUsers();
                alert('User Created Successfully!');
            } catch (err) {
                alert('Error creating user. If it fails, make sure "reg_date" column exists in database.');
            }
        });

        window.deleteUser = async (id) => {
            if (confirm('Delete this user?')) {
                await window.sbHelpers.deleteUser(id);
                loadUsers();
            }
        };

        // Allow Supabase init to finish
        setTimeout(loadUsers, 800);
    </script>
</body>

</html>
