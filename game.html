<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predict | Live Analysis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .logout-btn {
            margin-top: 40px;
            background: rgba(244, 63, 94, 0.05) !important;
            border: 1px solid rgba(244, 63, 94, 0.2) !important;
            color: var(--result-red) !important;
            padding: 12px 30px !important;
            font-size: 0.85rem !important;
            width: auto !important;
            display: inline-block !important;
            box-shadow: none !important;
            border-radius: 100px !important;
        }

        .logout-btn:hover {
            background: var(--result-red) !important;
            color: white !important;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3) !important;
        }

        #periodInput,
        #walletInput {
            font-family: monospace;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-align: center;
            padding: 12px 15px;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="glass-container">
        <header>
            <img src="logo.jpg" alt="AI Predict Logo" class="app-logo">
            <h1>AI <span>Predict</span></h1>
            <p class="subtitle">Live Analysis Pro</p>
        </header>

        <main>
            <div class="input-group">
                <label for="walletInput">WALLET BALANCE (₹)</label>
                <div class="input-wrapper">
                    <input type="number" id="walletInput" placeholder="Enter starting balance" autocomplete="off">
                    <span class="focus-border"></span>
                </div>
            </div>

            <div class="input-group">
                <label for="periodInput">PERIOD NUMBER</label>
                <div class="input-wrapper">
                    <input type="number" id="periodInput" placeholder="Ex: 273645" autocomplete="off">
                    <span class="focus-border"></span>
                </div>
            </div>

            <button id="startBtn" class="action-btn">
                <span class="btn-text">START ANALYSIS</span>
                <span class="btn-glow"></span>
            </button>

            <div id="resultCard" class="result-card hidden">
                <div class="loader hidden" id="loader">
                    <div class="spinner"></div>
                    <p>Analyzing Algo...</p>
                </div>
                <div id="predictionContent" class="hidden">
                    <p id="betInfo" class="bet-info">BET: ₹1</p>
                    <h2 id="predictionResult" class="result-value">RED</h2>

                    <div class="action-buttons">
                        <button id="winBtn" class="result-btn win-btn">WIN</button>
                        <button id="lossBtn" class="result-btn loss-btn">LOSS</button>
                    </div>
                </div>
            </div>

            <div class="summary-section">
                <div class="summary-card">
                    <p class="summary-label">TOTAL PROFIT</p>
                    <p id="totalProfitDisplay" class="summary-value">₹0</p>
                </div>
                <div class="summary-card">
                    <p class="summary-label">WALLET BALANCE</p>
                    <p id="currentBalanceDisplay" class="summary-value">₹0</p>
                </div>
                <div class="summary-card">
                    <p class="summary-label">TOTAL WINS</p>
                    <p id="totalWinsDisplay" class="summary-value">0</p>
                </div>
            </div>

            <div class="history-section">
                <div class="history-header">
                    <h3>History Log</h3>
                    <button id="clearHistoryBtn" class="clear-btn">Clear History</button>
                </div>
                <div class="table-container">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>Period</th>
                                <th>Amount</th>
                                <th>Profit</th>
                                <th>Result</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- History items will be added here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p class="expiry-warning">⚠️ SESSION EXPIRES IN 30 DAYS</p>
            <p>App Create in Krish and Number 9524772443</p>
            <a href="https://t.me/jawalfree" target="_blank" class="telegram-link">Join Telegram Channel</a>
            <div style="margin-top: 10px;">
                <button id="logoutBtn" class="action-btn logout-btn">END SESSION</button>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="script.js"></script>
</body>

</html>
